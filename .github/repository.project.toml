# The settings of this repository on top of .github/repository.toml, which the
# blueprint keeps current. blueprint.py and the settings bot add them: tables merge,
# lists gain their new items, and values replace those of repository.toml.
# https://github.com/Dennis-Otto/repo-blueprint#settings-as-code

# The end-to-end tests against every supported Nextcloud version, and against the
# newest one on PostgreSQL, and on MariaDB with S3 (e2e.yml, decision 0007).
[branch]
required_checks = ["nextcloud", "nextcloud on PostgreSQL, MariaDB and S3"]

# An environment of this project and the secrets it needs:
# [environments.deploy]
# secrets = ["DEPLOY_TOKEN"]

# The maintainer decided on 2026-11-18 that the releases go once a day by themselves:
# the release bot merges the release pull request in its daily run once every check
# passes, and the package goes to the Nextcloud App Store with it. A release at once,
# for a fix that can't wait, is a start of the workflow Release by hand.
[variables]
RELEASE_MERGE = "daily"
