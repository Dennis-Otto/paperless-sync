name: Visual check comment

# The second half of the visual check (visual.yml). When the check of a pull request
# ends, this workflow posts or updates one comment on the pull request: the pictures
# that look different, with the share of their pixels that changed, and links to them
# before and after. When one language failed to render, the comment still lists the
# pictures of the other one and names the language that failed. It may comment, so it
# never checks out or runs the code of the pull request: it reads only the reports of
# the check, takes nothing from them but paths and numbers it checks, and writes the
# comment itself. A pull request whose pictures all look as committed gets no comment,
# or its comment from before updated.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] reads the reports of the check only, never the code of the pull request
    workflows: [Visual check]
    types: [completed]

permissions: {}

concurrency:
  group: visual-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  comment:
    name: comment
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to download the reports of the check's run
      pull-requests: write # to post and update the comment
    steps:
      # The job may comment, so it reaches GitHub's API alone; Harden-Runner itself
      # allows the storage of the reports, which the artifacts of the check keep.
      # Without sudo and Docker no step can lift the block.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            api.github.com:443
      - name: Write the comment from the reports of the check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          # The pull request whose head is the commit the check rendered; a pull request
          # from a fork is found by the commit, and one that moved on gets no comment.
          number="$(jq -r --arg sha "$HEAD_SHA" '[.[] | select(.head.sha == $sha) | .number][0] // empty' <<<"$PULL_REQUESTS")"
          if [[ -z "$number" ]]; then
            number="$(gh pr list --state open --search "$HEAD_SHA" --json number,headRefOid \
              | jq -r --arg sha "$HEAD_SHA" '[.[] | select(.headRefOid == $sha) | .number][0] // empty')"
          fi
          if [[ -z "$number" || "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" != "$HEAD_SHA" ]]; then
            echo "No open pull request has $HEAD_SHA as its head any more."
            exit 0
          fi

          folder="$RUNNER_TEMP/visual"
          mkdir -p "$folder"
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | "\(.name) \(.id)"' > "$folder/artifacts.txt"
          # The report of every language that rendered, also when the other one failed.
          if grep -qE '^visual-(en|de) ' "$folder/artifacts.txt"; then
            gh run download "$RUN_ID" --pattern 'visual-??' --dir "$folder"
          fi

          python3 - "$folder" > "$folder/post" <<'PYTHON'
          import json
          import os
          import re
          import sys

          folder = sys.argv[1]
          # Only what a report of tests/e2e/compare.mjs may hold; anything else is left out.
          path_pattern = re.compile(
              r"^(?:docs/images/(?:de/)?[a-z0-9][a-z0-9-]*\.(?:png|gif)"
              r"|screenshots/[a-z0-9][a-z0-9-]*\.png)$"
          )
          statuses = {"changed", "new", "deleted"}
          languages = {"en": "English", "de": "German"}
          sha = os.environ["HEAD_SHA"][:7]
          run = os.environ["RUN_URL"]
          base = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GH_REPO']}/actions/runs/{os.environ['RUN_ID']}"
          links = {}
          with open(f"{folder}/artifacts.txt") as file:
              for line in file:
                  name, _, number = line.strip().partition(" ")
                  if name in (f"visual-{code}" for code in languages) and number.isdigit():
                      links[name[-2:]] = f"{base}/artifacts/{number}"


          def is_share(share):
              return isinstance(share, (int, float)) and not isinstance(share, bool) and 0 <= share <= 1


          def percent(share):
              if not is_share(share):
                  return "another size or frames"
              if share >= 1:
                  return "100 %"
              return "< 0.01 %" if share < 0.0001 else f"{share * 100:.2f} %"


          lines = ["<!-- visual-check -->", "### Visual check", ""]
          rows, unchanged, read, missing = [], 0, [], []
          for code in languages:
              try:
                  with open(f"{folder}/visual-{code}/report.json") as file:
                      report = json.load(file)
              except (OSError, ValueError):
                  report = None
              if not isinstance(report, dict) or not isinstance(report.get("images"), list):
                  missing.append(code)
                  continue
              read.append(code)
              if isinstance(report.get("unchanged"), int) and report["unchanged"] >= 0:
                  unchanged += report["unchanged"]
              for entry in report["images"]:
                  if not isinstance(entry, dict):
                      continue
                  path, status, share = entry.get("path"), entry.get("status"), entry.get("share")
                  if (
                      isinstance(path, str) and path_pattern.match(path)
                      and status in statuses
                      and (share is None or is_share(share))
                  ):
                      shown = percent(share) if status == "changed" else ""
                      rows.append(f"| `{path}` | {status} | {shown} |")
          # A language whose report is missing failed to render; the other one still
          # gets its report, named by its language.
          which = f"{languages[read[0]]} " if read and missing else ""
          post = "always"
          if not read:
              if os.environ["CONCLUSION"] == "success":
                  lines.append(f"The [run]({run}) left no report for {sha}.")
              else:
                  lines.append(f"The pictures could not be rendered for {sha}; the [run]({run}) shows why.")
          elif not rows:
              lines.append(f"Rendered from the Paperless mock with its frozen story for {sha}: every {which}picture looks as committed.")
              if not missing:
                  post = "existing"
          else:
              lines += [
                  f"Rendered from the Paperless mock with its frozen story for {sha}: {len(rows)} of "
                  f"{len(rows) + unchanged} {which}pictures look different from the committed ones.",
                  "",
                  "| Picture | Change | Pixels changed |",
                  "| --- | --- | ---: |",
                  *rows,
                  "",
              ]
              if links:
                  shown = " · ".join(f"[{languages[code]}]({link})" for code, link in sorted(links.items()))
                  lines.append(f"The pictures before and after, with every changed pixel in red: {shown}.")
              lines.append(
                  "This check only reports. When the change is intended, the screenshot bot "
                  "renews the pictures after the merge, in a pull request that merges itself."
              )
          if read and missing:
              names = " and ".join(languages[code] for code in missing)
              lines += ["", f"The {names} pictures could not be rendered for {sha}; the [run]({run}) shows why."]
          with open(f"{folder}/comment.md", "w") as file:
              file.write("\n".join(lines) + "\n")
          print(post)
          PYTHON

          post="$(cat "$folder/post")"
          existing="$(gh api "repos/$GH_REPO/issues/$number/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- visual-check -->"))) | .id' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$existing" -F "body=@$folder/comment.md" >/dev/null
            echo "Updated the comment on #$number."
          elif [[ "$post" == always ]]; then
            gh api --method POST "repos/$GH_REPO/issues/$number/comments" -F "body=@$folder/comment.md" >/dev/null
            echo "Commented on #$number."
          else
            echo "Every picture looks as committed; #$number needs no comment."
          fi
