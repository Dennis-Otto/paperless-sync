name: Docker E2E

# The end-to-end tests in Docker against the current release of every Nextcloud
# version that appinfo/info.xml supports, from min-version to max-version, so that
# raising max-version, as the upstream bot does, tests the new version at once, and
# against the newest version on PostgreSQL, and on MariaDB with an S3 object store as
# its primary storage (decision 0007). Beside them, it upgrades an installation in use
# on PostgreSQL and on MariaDB from the last release to the package of the commit,
# which krankerl builds as the release does (tests/e2e/upgrade.sh, decision 0028): the
# only test where the migrations meet rows. Two jobs, both required checks, share the
# work on a runner each (tests/e2e/run-all.sh with E2E_SHARD, decision 0029): nextcloud
# runs the oldest and the newest version, nextcloud on PostgreSQL, MariaDB and S3 the
# databases, S3 and the upgrades, and each version between goes to the one with the
# lighter load (a version with its browser checks counts as five, a variant as three
# and an upgrade as two), so that a fourth version doesn't make one of them twice as
# slow. Each job runs its share side by side: one wait for a runner instead of one for
# each, and the downloads of one run overlap with the installation of another.
#
# In a pull request, the versions run only when the change can affect the app
# (tests/e2e/affected.sh), the databases and S3 only when it can behave differently
# there: a change of the migrations, the state, the files in Nextcloud, the uploads,
# appinfo/info.xml or the tests, and the upgrade only when it can break that: a change
# of the migrations, the stored settings and state, the package, appinfo/info.xml or
# the tests. A change of the documentation or of other workflows alone, or a release,
# which only writes its version, passes both required checks at once. Every push to
# main runs them all, and so does every night, as the images of the versions move with
# each point release of Nextcloud.
#
# Every Monday, and when started by hand, they also run against the coming Nextcloud
# (tests/e2e/canary.sh): the beta or release candidate of the next major version, or
# the daily build of master. That job is no required check and blocks nothing. When
# it fails, it opens the issue "The coming Nextcloud breaks the app" with the first
# error of each run that failed, or adds the run with its own to it, and closes the
# issue once the tests pass again. It leaves max-version as it is; the upstream bot
# raises it when Nextcloud releases the version.
#
# On the same Monday, when started by hand, and in a pull request that changes how the
# app talks to Paperless (tests/e2e/affected.sh), the contract tests run against a real
# Paperless-ngx instead of the mock (tests/e2e/run-contract.sh): the last release of 2.x
# and the current one of 3.x, side by side. They check every answer that the app reads
# and then run the app against it, and they compare the shapes of the answers with the
# fixtures of the unit tests (tests/fixtures/). They are no required check either; a
# failure on Monday opens the issue "The contract tests against Paperless-ngx fail",
# or adds the run to it, each with its first error, and closes it once they pass again.
#
# A job that fails says what failed, why that matters and how to fix it, from
# .github/checks.project.toml: in its summary, as its annotation and, after the checks,
# in the comment of the PR coach on the pull request, also on one from a fork.
# tests/coach/test_checks_project.py checks that every job that runs the code does. It
# also names the first error of each run that failed (tests/e2e/failure.py), and a job of
# the end-to-end tests keeps the evidence for 14 days as its artifact e2e-<job>: the log
# of each run that failed, nextcloud.log, the apps, the logs of the containers and, of a
# check in the browser that failed, its trace, which npx playwright show-trace opens, and
# its screenshots (tests/e2e/README.md#when-a-run-fails).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every night: every supported version.
    - cron: "23 2 * * *"
    # Every Monday: the coming Nextcloud and a real Paperless-ngx.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

# A newer push to a pull request or to main replaces the run that is still going for
# the older one. A scheduled run and a run by hand have a group of their own and run
# to the end, so that neither a merge cancels the canary nor the canary a merge's run.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('run-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  nextcloud:
    name: nextcloud
    # The run of Monday morning is the coming Nextcloud's alone.
    if: github.event.schedule != '17 5 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit of a pull request and its base, which affected.sh compares.
          fetch-depth: 2
      - name: Find out whether the change can affect the app
        id: changes
        if: github.event_name == 'pull_request'
        run: bash tests/e2e/affected.sh
      - name: Run the Paperless Sync end-to-end tests against the oldest and the newest supported Nextcloud
        if: steps.changes.outputs.affected != 'false'
        env:
          # Shard 1: the oldest and the newest version, and the versions between that the
          # job variants doesn't take. Both jobs get the same variants, so that they
          # split the runs the same way; the job variants runs them.
          E2E_SHARD: 1
          # The files and the database of SQLite of each run in memory, on a runner that is
          # thrown away after the job.
          E2E_MEMORY_FOLDER: /dev/shm
          VARIANTS: ${{ steps.changes.outputs.variants }}
          UPGRADE: ${{ steps.changes.outputs.upgrade }}
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: |
          variants=()
          if [[ "$VARIANTS" != false ]]; then
            variants+=(pgsql mysql+s3)
          fi
          if [[ "$UPGRADE" != false ]]; then
            variants+=(pgsql+upgrade mysql+upgrade)
          fi
          E2E_VARIANTS="${variants[*]:-none}" bash tests/e2e/run-all.sh
      # The first error of each run that failed, in the summary of the check and as its
      # annotation, from the logs that the step before kept in E2E_ARTIFACTS.
      - name: Name the first error
        id: failure
        if: failure()
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: python3 tests/e2e/failure.py "$E2E_ARTIFACTS"
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: nextcloud
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
      - name: Keep the evidence of the failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-nextcloud
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14
      # The coverage of the JavaScript of the app in the checks in the browser on the newest
      # Nextcloud, whose table the summary of the check shows: lcov.info and
      # coverage-final.json show in an editor or with genhtml which lines no check runs. A
      # failed run keeps it in e2e-nextcloud, with the coverage of each page in v8/.
      - name: Keep the coverage of the JavaScript
        if: success() && steps.changes.outputs.affected != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-coverage
          path: |
            ${{ runner.temp }}/e2e-artifacts/*/coverage/
            !${{ runner.temp }}/e2e-artifacts/*/coverage/v8/
          if-no-files-found: ignore
          retention-days: 14

  variants:
    name: nextcloud on PostgreSQL, MariaDB and S3
    if: github.event.schedule != '17 5 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit of a pull request and its base, which affected.sh compares.
          fetch-depth: 2
      - name: Find out whether the change can affect the app, behave differently on another database or storage, or break the upgrade
        id: changes
        if: github.event_name == 'pull_request'
        run: bash tests/e2e/affected.sh
      # The same krankerl as the CI's and the release workflow's, for the package of the
      # commit that the upgrade installs: its pin is read from ci.yml, which the blueprint
      # updates, so there is no copy here to fall behind; scripts/check-project.sh checks
      # that ci.yml names exactly one of each.
      - name: Use the krankerl of the CI and of the release
        if: steps.changes.outputs.upgrade != 'false'
        run: |
          sed -nE 's/^[[:space:]]*(KRANKERL_(VERSION|SHA256)):[[:space:]]*([^[:space:]]+).*/\1=\3/p' \
            .github/workflows/ci.yml >> "$GITHUB_ENV"
      # krankerl comes from the cache once a run has downloaded it, as in the CI, and
      # its package is checked by its sha256 either way.
      - name: Restore krankerl from the cache
        if: steps.changes.outputs.upgrade != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/krankerl
          key: krankerl-${{ env.KRANKERL_VERSION }}-${{ env.KRANKERL_SHA256 }}
      - name: Install krankerl, which builds the package of the commit for the upgrade
        if: steps.changes.outputs.upgrade != 'false'
        run: |
          deb="$RUNNER_TEMP/krankerl/krankerl_${KRANKERL_VERSION}_amd64.deb"
          if [[ ! -f "$deb" ]]; then
            mkdir -p "$RUNNER_TEMP/krankerl"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
              --connect-timeout 15 --max-time 300 --output "$deb" \
              "https://github.com/ChristophWurst/krankerl/releases/download/v$KRANKERL_VERSION/krankerl_${KRANKERL_VERSION}_amd64.deb"
          fi
          echo "$KRANKERL_SHA256  $deb" | sha256sum --check --strict
          sudo dpkg --install "$deb"
      - name: Run the Paperless Sync end-to-end tests on PostgreSQL, on MariaDB with S3, the upgrade from the last release, and the versions between
        # Without a pull request, the step changes doesn't run, and so this one runs all.
        if: steps.changes.outputs.affected != 'false' || steps.changes.outputs.upgrade != 'false'
        env:
          # Shard 2: the variants that the change needs, and the versions between that
          # job nextcloud doesn't take. Both jobs list the same variants, so that they
          # split the runs the same way. A change that can only break the upgrade, such
          # as one of the package, runs no version.
          E2E_SHARD: 2
          E2E_VERSIONS: ${{ steps.changes.outputs.affected == 'false' && 'none' || '' }}
          # The files and the database of SQLite of each run in memory, on a runner that is
          # thrown away after the job.
          E2E_MEMORY_FOLDER: /dev/shm
          VARIANTS: ${{ steps.changes.outputs.variants }}
          UPGRADE: ${{ steps.changes.outputs.upgrade }}
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: |
          variants=()
          if [[ "$VARIANTS" != false ]]; then
            variants+=(pgsql mysql+s3)
          fi
          if [[ "$UPGRADE" != false ]]; then
            variants+=(pgsql+upgrade mysql+upgrade)
          fi
          E2E_VARIANTS="${variants[*]:-none}" bash tests/e2e/run-all.sh
      # The first error of each run that failed, in the summary of the check and as its
      # annotation, from the logs that the step before kept in E2E_ARTIFACTS.
      - name: Name the first error
        id: failure
        if: failure()
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: python3 tests/e2e/failure.py "$E2E_ARTIFACTS"
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: nextcloud on PostgreSQL, MariaDB and S3
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
      - name: Keep the evidence of the failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-variants
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14

  coming:
    name: coming Nextcloud
    if: github.event.schedule == '17 5 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.canary.outputs.version }}
      first-error: ${{ steps.failure.outputs.first-error }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the Paperless Sync end-to-end tests against the coming Nextcloud
        id: canary
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: bash tests/e2e/canary.sh
      # The first error of each run that failed, in the summary of the check and as its
      # annotation, and for the issue, from the logs that the step before kept in E2E_ARTIFACTS.
      - name: Name the first error
        id: failure
        if: failure()
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: python3 tests/e2e/failure.py "$E2E_ARTIFACTS"
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: coming Nextcloud
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
      - name: Keep the evidence of the failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-coming
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14

  # The contract tests against a real Paperless-ngx, one line of it in each job:
  # tests/e2e/run-contract.sh. A pull request runs them only when it changes how the app
  # talks to Paperless; the job passes at once otherwise, and so for a docs change.
  paperless:
    name: Paperless-ngx ${{ matrix.line }}.x
    if: >-
      github.event.schedule == '17 5 * * 1' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # The first error of each line has a name of its own, as a job of a matrix would
    # overwrite the output of another of the same name.
    outputs:
      first-error-2: ${{ steps.failure.outputs.first-error-2 }}
      first-error-3: ${{ steps.failure.outputs.first-error-3 }}
    strategy:
      # Each line of Paperless tells its own story.
      fail-fast: false
      matrix:
        line: [2, 3]
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit of a pull request and its base, which affected.sh compares.
          fetch-depth: 2
      - name: Find out whether the change can alter how the app talks to Paperless
        id: changes
        if: github.event_name == 'pull_request'
        env:
          E2E_QUESTION: contract
        run: bash tests/e2e/affected.sh
      - name: Run the contract tests against Paperless-ngx ${{ matrix.line }}.x
        if: steps.changes.outputs.contract != 'false'
        env:
          LINE: ${{ matrix.line }}
          # The answers of Paperless, for the fixtures of the unit tests when they changed.
          CONTRACT_RECORDINGS: ${{ runner.temp }}/paperless-ngx-${{ matrix.line }}
          # The log and the title of the run, from which failure.py names its first error.
          RUN_FOLDER: ${{ runner.temp }}/contract/paperless-ngx-${{ matrix.line }}
        run: |
          set -o pipefail
          mkdir -p "$RUN_FOLDER"
          echo "Paperless-ngx $LINE.x" >"$RUN_FOLDER/title.txt"
          bash tests/e2e/run-contract.sh "$LINE" 2>&1 | tee "$RUN_FOLDER/run.log"
      # The first error of the line, in the summary of the check, as its annotation and
      # for the issue.
      - name: Name the first error
        id: failure
        if: failure()
        env:
          RUNS: ${{ runner.temp }}/contract
          OUTPUT: first-error-${{ matrix.line }}
        run: python3 tests/e2e/failure.py "$RUNS" "$OUTPUT"
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.project.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: Paperless-ngx ${{ matrix.line }}.x
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
      - name: Keep the answers of Paperless
        if: always() && steps.changes.outputs.contract != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paperless-ngx-${{ matrix.line }}
          path: ${{ runner.temp }}/paperless-ngx-${{ matrix.line }}
          if-no-files-found: ignore
          retention-days: 14

  # The issues about the coming Nextcloud and about Paperless-ngx: one job for each, with
  # one step that opens the issue with the first error of each run that failed, adds each
  # further failure with its own, and closes the issue once the tests pass again. The
  # only jobs that may write issues, so they run no code of the repository and reach
  # GitHub alone. A run started by hand on another branch than main reports nothing.
  issue:
    name: issue
    needs: [coming, paperless]
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)) &&
      (contains(fromJSON('["success", "failure"]'), needs.coming.result) ||
      contains(fromJSON('["success", "failure"]'), needs.paperless.result))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # The texts of each issue are in the step, so that the names of the runs stay short.
        job: [coming, paperless]
    steps:
      - name: Allow the network traffic to GitHub alone
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: Open, update or close the issue
        if: needs[matrix.job].result == 'success' || needs[matrix.job].result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB: ${{ matrix.job }}
          COMING_TITLE: The coming Nextcloud breaks the app
          COMING_TESTS: end-to-end tests
          # Without a version, the job couldn't set the coming Nextcloud up.
          COMING_AGAINST: the coming Nextcloud, which the job could not set up
          COMING_ABOUT: >-
            The canary of `.github/workflows/e2e.yml` runs `tests/e2e/canary.sh`: the
            end-to-end tests against the beta or release candidate of the next major
            version of Nextcloud, or against the daily build of its master branch while
            there is none. Nextcloud hasn't released that version yet, so the canary is
            no required check and blocks nothing; it gives notice before the release,
            while there is time to adapt the app. `max-version` of `appinfo/info.xml`
            stays as it is; the upstream bot raises it once Nextcloud releases the version.


            The artifact e2e-coming of the run holds the log, `nextcloud.log`, the apps
            and the logs of the containers and, of a check in the browser that failed,
            its trace, which `npx playwright show-trace` opens, and its screenshots
            (`tests/e2e/README.md`, "When a run fails"). `bash tests/e2e/canary.sh` runs
            the same tests locally.


            The canary adds every further failed run here and closes this issue once the
            tests pass again.
          PAPERLESS_TITLE: The contract tests against Paperless-ngx fail
          PAPERLESS_TESTS: contract tests
          PAPERLESS_AGAINST: Paperless-ngx 2.x and 3.x
          PAPERLESS_ABOUT: >-
            The job `paperless` of `.github/workflows/e2e.yml` runs
            `tests/e2e/run-contract.sh` against the last release of Paperless-ngx 2.x and
            the current release of 3.x, whose images Renovate keeps current. It checks
            every answer of Paperless that the app reads, runs the app against it, and
            compares the shapes of the answers with the fixtures of the unit tests in
            `tests/fixtures/`. A failure means that a release of Paperless-ngx answers
            differently than the app expects, that a field the unit tests read is gone,
            or that a change of the app (its paths, reports, settings or status) no
            longer matches what `tests/e2e/contract.py` expects.


            The log of the failed job names the answer and the field; its artifact
            paperless-ngx-2 or paperless-ngx-3 holds the answers of Paperless.
            `bash tests/e2e/run-contract.sh 2` or `3` runs the same tests locally, and
            `CONTRACT_RECORD=1` writes the new answers into the fixtures once the app
            reads them.


            The job adds every further failed run here and closes this issue once the
            tests pass again.
          RESULT: ${{ needs[matrix.job].result }}
          # The outputs of the job: the version of the coming Nextcloud, and the first
          # error of each run that failed, which tests/e2e/failure.py wrote.
          OUTPUTS: ${{ toJSON(needs[matrix.job].outputs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$JOB" in
            coming) prefix=COMING ;;
            *) prefix=PAPERLESS ;;
          esac
          for name in TITLE TESTS AGAINST ABOUT; do
            variable="${prefix}_${name}"
            printf -v "$name" '%s' "${!variable}"
          done
          export TITLE
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')"
          version="$(jq -r '.version // empty' <<<"$OUTPUTS")"
          against="${version:-$AGAINST}"
          if [[ "$RESULT" == success ]]; then
            if [[ -n "$number" ]]; then
              gh issue close "$number" --reason completed \
                --comment "The $TESTS pass again against $against: $RUN_URL"
            fi
            exit 0
          fi
          errors="$(jq -r '[to_entries[] | select(.key | startswith("first-error")) | select(.value != "")] |
            sort_by(.key) | map(.value) | join("\n")' <<<"$OUTPUTS")"
          if [[ -z "$errors" ]]; then
            errors="The log of the run shows what failed; the job named no first error."
          fi
          if [[ -n "$number" ]]; then
            printf 'The %s still fail against %s: %s\n\nThe first error of each run that failed:\n\n%s\n' \
              "$TESTS" "$against" "$RUN_URL" "$errors" >"$RUNNER_TEMP/comment.md"
            gh issue comment "$number" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          printf 'The weekly %s fail against %s: %s\n\nThe first error of each run that failed:\n\n%s\n\n%s\n' \
            "$TESTS" "$against" "$RUN_URL" "$errors" "$ABOUT" >"$RUNNER_TEMP/issue.md"
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
