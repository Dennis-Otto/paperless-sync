# The preview card of the home page, which shows where a link to the website is
# shared: the social preview of the repository, as GitHub shows it for links to the
# repository, instead of a card with the name of the page. scripts/social-preview.sh
# renders it from .github/social-preview.html. docs/index.md chooses this layout in
# its front matter; the other pages keep the default card of the social plugin.
# https://squidfunk.github.io/mkdocs-material/plugins/social/#layouts
size: { width: 1280, height: 640 }
layers:
  - background:
      image: .github/social-preview.png

tags:
  # Open Graph
  og:type: website
  og:title: "{{ config.site_name }}"
  og:description: "{{ page.meta.get('description', config.site_description) }}"
  og:image: "{{ image.url }}"
  og:image:type: "{{ image.type }}"
  og:image:width: "{{ image.width }}"
  og:image:height: "{{ image.height }}"
  og:image:alt: "{{ config.site_name }} for Nextcloud: a finished document of Paperless-ngx, synchronized on its own into the folders of Nextcloud by correspondent, type and year"
  og:url: "{{ page.canonical_url }}"

  # Twitter
  twitter:card: summary_large_image
  twitter:title: "{{ config.site_name }}"
  twitter:description: "{{ page.meta.get('description', config.site_description) }}"
  twitter:image: "{{ image.url }}"
  twitter:image:alt: "{{ config.site_name }} for Nextcloud: a finished document of Paperless-ngx, synchronized on its own into the folders of Nextcloud by correspondent, type and year"
