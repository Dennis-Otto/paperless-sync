# The area labels of pull requests by the files they change, for the Area labels
# workflow; each label is an area of .github/labels.toml. Every file of lib/, js/,
# css/, templates/ and tests/Unit/ belongs to an area, and scripts/check-project.sh
# keeps it so: * stays within a folder and ** spans folders, as the labeler reads
# them. l10n/ has no area; the title check labels a pull request of translations.
"area: settings":
  - changed-files:
      - any-glob-to-any-file:
          - lib/Controller/SettingsController.php
          - lib/Settings/**
          - lib/Service/ConfigService.php
          - lib/Service/InvalidSettingException.php
          - lib/Service/RunsOffException.php
          - lib/Service/PaperlessLocalNetworkException.php
          - lib/Service/UnsavedSettingException.php
          - lib/Model/SyncConfig.php
          - lib/Model/ConnectionCheck.php
          - lib/Model/Owners.php
          - lib/Service/OwnerMapping.php
          - lib/Migration/Version000111Date20261013000000.php
          - lib/Migration/Version000130Date20261014120000.php
          - js/settings.js
          - css/settings.css
          - templates/settings.php
          - tests/Unit/Controller/SettingsController*
          - tests/Unit/Controller/ControllerRoutesTest.php
          - tests/Unit/Settings/**
          - tests/Unit/Service/ConfigServiceTest.php
          - tests/Unit/Model/ConnectionCheckTest.php
          - tests/Unit/Model/OwnersTest.php
          - tests/Unit/Service/OwnerMappingTest.php
          - tests/Unit/Migration/Version000111*
          - tests/Unit/Migration/Version000130*
