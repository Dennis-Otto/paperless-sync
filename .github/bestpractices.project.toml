# The answers of OpenSSF Best Practices (https://www.bestpractices.dev) that only this
# repository can give, on top of .bestpractices.json, which the blueprint keeps current
# with what it guarantees for every repository of its kind. Never change that file: an
# answer of this repository alone goes here, and no update of the blueprint touches it.
#
# One table for each criterion, named as in .bestpractices.json, such as [test] or
# [osps_br_07_01]. For a criterion that .bestpractices.json answers, a table gives only
# its justification, which replaces the file's own: the status stays the blueprint's
# Met. For any other criterion, such as security_review, a table gives status (Met,
# Unmet or N/A) and justification. A link names a file or a heading of this repository,
# or uses https. Only what is true of this repository belongs here, such as its own
# end-to-end tests:
#
# [test]
# justification = "pytest, and the end-to-end tests in Docker: https://github.com/OWNER/REPOSITORY/blob/main/tests/e2e/run.sh"
#
# [security_review]
# status = "Met"
# justification = "..."
#
# The weekly run of the workflow Links compares the public entry with both files and
# keeps an issue with the links of the edit pages that take the answers in: change an
# answer here, not on the site, as these links force it back. "Save (and continue)" on
# bestpractices.dev reads .bestpractices.json only. The step "Answers for
# bestpractices.dev" of scripts/check.sh checks this file with
# python3 .github/blueprint.py best-practices --verify.
# https://github.com/Dennis-Otto/repo-blueprint/blob/main/docs/features/bots.md#the-entry-on-bestpracticesdev

[test]
justification = "An automated test suite: PHPUnit, which scripts/check.sh runs with its coverage, on a computer and in the CI, and which fails when a line of lib/ runs in no test; and the end-to-end tests in Docker, which run the app in every Nextcloud version that appinfo/info.xml supports, from min-version to max-version, against a mock of Paperless-ngx, in the newest of them on PostgreSQL and on MariaDB with an S3 object store as well, and upgrade an installation in use from the last release to the package of the commit: https://github.com/Dennis-Otto/paperless-sync/blob/main/tests/e2e/README.md"

[test_invocation]
justification = "bash scripts/check.sh runs the tests with every other check, the same on a computer and in the CI, and composer test runs PHPUnit alone; bash tests/e2e/run-all.sh runs the end-to-end tests in Docker against every supported Nextcloud version side by side, and bash tests/e2e/run.sh against one version: https://github.com/Dennis-Otto/paperless-sync/blob/main/CONTRIBUTING.md#checks"

[test_continuous_integration]
justification = "The CI runs scripts/check.sh with the tests, Psalm and php-cs-fixer on every pull request and after every change of main, as a required check; the workflow Docker E2E runs the end-to-end tests against every supported Nextcloud version, and against the newest on PostgreSQL and on MariaDB with S3, as two more required checks, after every change of main, every night and in each pull request whose change can affect what they test; every Monday they run against the coming Nextcloud and the contract tests against a real Paperless-ngx: https://github.com/Dennis-Otto/paperless-sync/blob/main/.github/workflows/e2e.yml"

[automated_integration_testing]
justification = "The CI runs scripts/check.sh with the whole test suite, which fails when a line of lib/ runs in no test, on every pull request and after every change of main, and reports its success or failure as a required check; the workflow Docker E2E runs the app in Docker in every Nextcloud version that appinfo/info.xml supports and in the newest on PostgreSQL and on MariaDB with S3, against a mock of Paperless-ngx, and upgrades an installation in use from the last release, after every change of main, every night and in each pull request whose change can affect what they test, and reports both of its jobs as required checks: https://github.com/Dennis-Otto/paperless-sync/blob/main/tests/e2e/README.md#in-the-ci"
