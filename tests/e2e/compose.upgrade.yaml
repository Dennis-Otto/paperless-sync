# The upgrade of an installation in use (upgrade.sh): run.sh adds this file to
# compose.yaml with E2E_UPGRADE=1. Nextcloud then has no checkout mounted at the folder of
# the app: the test unpacks the package of the last release there, and later the package
# of the commit, as an administrator's update does, into the volume of Nextcloud.

services:
  nextcloud:
    volumes: !override
      - nextcloud_html:/var/www/html
