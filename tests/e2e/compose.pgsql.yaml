# Nextcloud on PostgreSQL instead of SQLite: run.sh adds this file to compose.yaml
# with E2E_DATABASE=pgsql and installs Nextcloud with it.

services:
  postgres:
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: e2e-only-password
    # The database lives as long as its container; in memory, it doesn't wait for the disk.
    # The folder of PostgreSQL itself: from PostgreSQL 18 on, the image keeps its data in
    # /var/lib/postgresql/<major>/docker and refuses to start when /var/lib/postgresql/data,
    # the folder of the versions before, is a mount of its own. scripts/check-project.sh
    # checks it.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username=nextcloud", "--dbname=nextcloud"]
      # Often while it starts, and seldom once it runs, as in compose.yaml.
      start_period: 120s
      start_interval: 1s
      interval: 1m
      timeout: 2s
      retries: 2

  nextcloud:
    depends_on:
      postgres:
        condition: service_healthy
