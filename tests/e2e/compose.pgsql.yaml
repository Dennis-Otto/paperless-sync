# Nextcloud on PostgreSQL instead of SQLite: run.sh adds this file to compose.yaml
# with E2E_DATABASE=pgsql and installs Nextcloud with it.

services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: e2e-only-password
    # The database lives as long as its container; in memory, it doesn't wait for the disk.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--username=nextcloud", "--dbname=nextcloud"]
      # Often while it starts, and seldom once it runs, as in compose.yaml.
      start_period: 120s
      start_interval: 1s
      interval: 1m
      timeout: 2s
      retries: 2

  nextcloud:
    depends_on:
      postgres:
        condition: service_healthy
