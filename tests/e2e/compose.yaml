services:
  paperless-mock:
    image: python:3.14-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
    command: ["python", "/mock/mock_server.py"]
    # Python as process 1 would ignore the signal to stop, and Docker would wait for it.
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./:/mock:ro
    # The tests control the mock and read what it has seen from the host, with curl on a
    # port of 127.0.0.1 that Docker chooses and run.sh looks up, so that the suites of
    # run-all.sh side by side never meet on one.
    ports:
      - "127.0.0.1::8080"
    networks:
      default:
        # The name of Paperless in the screenshots of the documentation (screenshots.sh).
        aliases: [paperless]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      # Each check starts a process through Docker, which costs a runner more than the
      # suite can spare with several runs side by side: often while the service starts,
      # and seldom once it runs (tests/e2e/README.md#how-the-suite-stays-quick).
      start_period: 60s
      start_interval: 1s
      interval: 1m
      timeout: 2s
      retries: 1

  nextcloud:
    image: ${NEXTCLOUD_IMAGE:-nextcloud:33.0.9-apache@sha256:a97666d6ae931bde78a80cfba8abdf46d436d7b540f31895803f6fb0a012d689}
    depends_on:
      paperless-mock:
        condition: service_healthy
    environment:
      NEXTCLOUD_ADMIN_USER: e2e-admin
      NEXTCLOUD_ADMIN_PASSWORD: e2e-only-password
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
    ports:
      - "${E2E_PORT:-18083}:80"
    volumes:
      - nextcloud_html:/var/www/html
      # The files and the database of SQLite. E2E_DATA_FOLDER, a folder in memory in the CI
      # (run-all.sh), spares every commit of SQLite the wait for the disk, and stays through
      # a restart of the container, which a tmpfs of Compose wouldn't.
      - ${E2E_DATA_FOLDER:-nextcloud_data}:/var/www/html/data
      - ../../:/var/www/html/custom_apps/paperless_sync:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/status.php >/dev/null || exit 1"]
      start_period: 180s
      start_interval: 1s
      interval: 1m
      timeout: 3s
      retries: 1

volumes:
  nextcloud_html:
  nextcloud_data:
