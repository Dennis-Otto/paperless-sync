# Nextcloud on MariaDB instead of SQLite: run.sh adds this file to compose.yaml with
# E2E_DATABASE=mysql and installs Nextcloud with it.

services:
  mariadb:
    image: mariadb:11.8.9@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    # The settings that Nextcloud asks of MySQL and MariaDB:
    # https://docs.nextcloud.com/server/latest/admin_manual/configuration_database/linux_database_configuration.html
    command: ["--transaction-isolation=READ-COMMITTED", "--binlog-format=ROW"]
    environment:
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: e2e-only-password
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    # The database lives as long as its container; in memory, it doesn't wait for the disk.
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      # Often while it starts, and seldom once it runs, as in compose.yaml.
      start_period: 120s
      start_interval: 1s
      interval: 1m
      timeout: 2s
      retries: 1

  nextcloud:
    depends_on:
      mariadb:
        condition: service_healthy
