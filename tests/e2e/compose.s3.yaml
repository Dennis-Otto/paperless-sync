# Nextcloud with an object store as its primary storage, as many larger installations
# have it: run.sh adds this file to compose.yaml with E2E_OBJECTSTORE=s3. SeaweedFS
# serves the API of S3. Nextcloud keeps every file as an object in its bucket, and it
# reads them as streams of no known size, which the inbox of the app must upload to
# Paperless all the same (Dennis-Otto/paperless-sync#73).

services:
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # Master, volume, filer and S3 in one process, which sends no telemetry.
    command: ["server", "-s3", "-master.telemetry=false"]
    environment:
      # The only key that the S3 API accepts; a request without it is refused.
      AWS_ACCESS_KEY_ID: e2e-only-key
      AWS_SECRET_ACCESS_KEY: e2e-only-secret
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 2s
      retries: 60

  nextcloud:
    depends_on:
      s3:
        condition: service_healthy
    # The configuration of the image, config/s3.config.php, reads them:
    # https://github.com/nextcloud/docker#configuring-object-storage
    environment:
      OBJECTSTORE_S3_HOST: s3
      OBJECTSTORE_S3_PORT: "8333"
      OBJECTSTORE_S3_SSL: "false"
      OBJECTSTORE_S3_USEPATH_STYLE: "true"
      OBJECTSTORE_S3_REGION: us-east-1
      OBJECTSTORE_S3_BUCKET: nextcloud
      OBJECTSTORE_S3_AUTOCREATE: "true"
      OBJECTSTORE_S3_KEY: e2e-only-key
      OBJECTSTORE_S3_SECRET: e2e-only-secret
