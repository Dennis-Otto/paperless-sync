# The documentation website: MkDocs with the Material theme builds it from the pages
# in docs/, and the Docs workflow publishes it on GitHub Pages with every change of
# main. This file belongs to the project: the blueprint writes it once, and its
# updates leave it as it is. The settings that every website shares come from
# .github/mkdocs-blueprint.yml, which the blueprint keeps current; a setting here
# wins over the same one there. Preview the website while you write with
#   pip install --require-hashes -r .github/docs-requirements.txt && mkdocs serve
# https://squidfunk.github.io/mkdocs-material/
INHERIT: .github/mkdocs-blueprint.yml
site_name: "Paperless Sync"
site_description: "Nextcloud app that syncs Paperless-ngx documents into Nextcloud Files, by correspondent, type and year, and sends an inbox folder to Paperless. No WebDAV, no Nextcloud password."
site_url: https://dennis-otto.github.io/paperless-sync/
repo_url: https://github.com/Dennis-Otto/paperless-sync
repo_name: Dennis-Otto/paperless-sync
copyright: "© 2026 Dennis Otto"

# The brand of the app: its icon, img/app.svg, as the logo and the favicon, and the
# colors of the icon in docs/stylesheets/brand.css, light or dark with the switch in
# the header, as the blueprint sets it. scripts/check-project.sh keeps the copy of
# the icon in docs/images equal to that of the app.
theme:
  logo: images/app.svg
  favicon: images/app.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/brand.css

plugins:
  search:
    lang: [en, de]
  # English and German. A German page sits next to its English one, named like it with
  # .de, such as guide.de.md next to guide.md, and takes its snippets from README.de.md;
  # together they make the German website in de/, with German menus, search, dates and
  # switches, and a switch between the languages in the header that keeps the page. A
  # page without a German version shows in English there; when it links to a heading of
  # a German page, such as guide.md#requirements, the German page has an anchor of that
  # name above its heading, <a id="requirements"></a>, and the strict build names one
  # that is missing. scripts/check-project.sh keeps the headings, snippets and diagrams
  # of each German page in step with its English one.
  # https://ultrabug.github.io/mkdocs-static-i18n/
  i18n:
    enabled: true
    languages:
      - locale: en
        name: English
        default: true
        build: true
      - locale: de
        name: Deutsch
        build: true
        site_description: "Nextcloud-App, die Dokumente von Paperless-ngx in Nextcloud Dateien synchronisiert, nach Korrespondent, Typ und Jahr, und einen Eingangsordner an Paperless schickt. Ohne WebDAV, ohne Nextcloud-Passwort."
        nav_translations:
          Home: Start
          Guide: Anleitung
          Help: Hilfe
          Troubleshooting: Fehlerbehebung
          Compare: Vergleich
          Architecture: Architektur
          Security design: Sicherheitsdesign
          Development: Entwicklung
          Automation: Automatisierung
          Changelog: Änderungen
          Decisions: Entscheidungen
        # The switch between the light and the dark theme, with German names.
        theme:
          palette:
            - media: "(prefers-color-scheme: light)"
              scheme: default
              primary: custom
              accent: custom
              toggle:
                icon: material/weather-night
                name: Zum dunklen Design wechseln
            - media: "(prefers-color-scheme: dark)"
              scheme: slate
              primary: custom
              accent: custom
              toggle:
                icon: material/weather-sunny
                name: Zum hellen Design wechseln
  # The preview card of a page, which shows where a link to it is shared, in the dark
  # blue of the social preview of the repository. The home page shows the social
  # preview itself, .github/social-preview.png, with the layout in .github/social-cards.
  social:
    cards_layout_dir: .github/social-cards
    cards_layout_options:
      background_color: "#0c1424"
      color: "#ffffff"

# The hooks of the blueprint, and the one of this website, which fills in the
# versions of Nextcloud and PHP from appinfo/info.xml.
hooks:
  - .github/mkdocs_blueprint.py
  - .github/mkdocs_project.py

# The menu. A tab in the header for each section.
nav:
  - Home: index.md
  - Guide: guide.md
  - Help:
      - FAQ: faq.md
      - Troubleshooting: troubleshooting.md
  - Compare: alternatives.md
  - Architecture: architecture.md
  - Security design: security.md
  - Roadmap: roadmap.md
  - Development: development.md
  - Automation: automation.md
  - Releases: releases.md
  - Changelog: changelog.md
  - Decisions: decisions/README.md
